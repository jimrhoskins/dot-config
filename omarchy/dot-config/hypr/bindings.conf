# Application bindings

$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser
$monitorspec = "eDP-1,preferred,0x0,1.33333 "

unbind = SUPER, X
unbind = SUPER SHIFT, X
bindld = SUPER, X, Enable internal display, exec, hyprctl keyword monitor $monitorspec
bindld = SUPER SHIFT, X, Disable internal display, exec, hyprctl keyword monitor "eDP-1,disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor $monitorspec
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"

bindd = SUPER, return, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
bindd = SUPER, I, Browser (beta), exec, brave-beta --private
bindd = SUPER SHIFT, I, Browser (beta private), exec, brave-beta --private
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, T, Activity, exec, $terminal -e btop
bindd = SUPER, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER, slash, Passwords, exec, uwsm app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
# bindd = SUPER SHIFT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
# bindd = SUPER, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER, E, Email, exec, omarchy-launch-webapp "https://mail.google.com"
# bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"

bindd = SUPER, Z, Maximize, fullscreen, 1
bindd = SUPER SHIFT, Z, Maximize, fullscreen, 0

# Rebind togglesplit to SUPER + S
unbind = SUPER, J
bindd = SUPER, S, Toggle split, togglesplit, # dwindle

# Rebind Keybind search to SUPER + ?
unbind = SUPER, K
bindd = SUPER SHIFT, slash, Show key bindings, exec, omarchy-menu-keybindings

# Move focus with SUPER + arrow keys
bindd = SUPER, h, Move focus left, movefocus, l
bindd = SUPER, j, Move focus down, movefocus, d
bindd = SUPER, k, Move focus up, movefocus, u
bindd = SUPER, l, Move focus right, movefocus, r

# Swap active window with the one next to it with SUPER + SHIFT + arrow keys
bindd = SUPER SHIFT, h, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, j, Swap window down, swapwindow, d
bindd = SUPER SHIFT, k, Swap window up, swapwindow, u
bindd = SUPER SHIFT, l, Swap window to the right, swapwindow, r

bindd = SUPER CTRL, h, Move window to prev workspace, movetoworkspace, -1
bindd = SUPER CTRL, l, Move window to next workspace, movetoworkspace, +1
bindd = SUPER CTRL, j, Move workspace to prev monitor,  movecurrentworkspacetomonitor, -1  
bindd = SUPER CTRL, k, Move workspace to next monitor,  movecurrentworkspacetomonitor, +1 
bindd = SUPER CTRL, ;, Focus next monitor,  focusmonitor, +1 

bindd = SUPER, c, Centered master, layoutmsg, orientationcycle left center right
bindd = SUPER, u, Switch Layout, exec, ~/.config/hypr/toggle-layout.sh

bindd = SUPER CTRL, code:10, Open workspace 1 to this monitor, focusworkspaceoncurrentmonitor, 1
bindd = SUPER CTRL, code:11, Open workspace 2 to this monitor, focusworkspaceoncurrentmonitor, 2
bindd = SUPER CTRL, code:12, Open workspace 3 to this monitor, focusworkspaceoncurrentmonitor, 3
bindd = SUPER CTRL, code:13, Open workspace 4 to this monitor, focusworkspaceoncurrentmonitor, 4
bindd = SUPER CTRL, code:14, Open workspace 5 to this monitor, focusworkspaceoncurrentmonitor, 5
bindd = SUPER CTRL, code:15, Open workspace 6 to this monitor, focusworkspaceoncurrentmonitor, 6
bindd = SUPER CTRL, code:16, Open workspace 7 to this monitor, focusworkspaceoncurrentmonitor, 7
bindd = SUPER CTRL, code:17, Open workspace 8 to this monitor, focusworkspaceoncurrentmonitor, 8
bindd = SUPER CTRL, code:18, Open workspace 9 to this monitor, focusworkspaceoncurrentmonitor, 9
bindd = SUPER CTRL, code:19, Open workspace 10 to this monitor0, focusworkspaceoncurrentmonitor, 10

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
